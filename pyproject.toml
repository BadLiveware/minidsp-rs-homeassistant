[project]
name = "minidsp-rs-homeassistant"
version = "0.1.1"
description = "Home Assistant custom integration for minidsp-rs"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Fredrik Larsson" }]

[dependency-groups]
dev = [
  "homeassistant==2026.8.3",
  "pytest-cov>=7.0.0",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/minidsp_rs"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
